name: Android

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: deepen-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.0"

      - name: Resolve release version
        if: github.event_name != 'pull_request'
        run: |
          set -a
          source version.properties
          set +a

          NEXT_VERSION_CODE=$((VERSION_CODE + 1))
          VERSION_PREFIX="${VERSION_NAME%.*}"
          NEXT_VERSION_NAME="${VERSION_PREFIX}.${NEXT_VERSION_CODE}"

          echo "VERSION_CODE=${NEXT_VERSION_CODE}" >> "$GITHUB_ENV"
          echo "VERSION_NAME=${NEXT_VERSION_NAME}" >> "$GITHUB_ENV"

          echo "Release version: ${NEXT_VERSION_NAME} (${NEXT_VERSION_CODE})"

      - name: Build debug APK
        if: github.event_name == 'pull_request'
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: gradle :app:assembleDebug -PYOUTUBE_API_KEY="$YOUTUBE_API_KEY"

      - name: Verify release signing secrets
        if: github.event_name != 'pull_request'
        env:
          DEEPEN_KEYSTORE_B64: ${{ secrets.DEEPEN_KEYSTORE_B64 }}
          DEEPEN_KEYSTORE_PASSWORD: ${{ secrets.DEEPEN_KEYSTORE_PASSWORD }}
          DEEPEN_KEY_ALIAS: ${{ secrets.DEEPEN_KEY_ALIAS }}
          DEEPEN_KEY_PASSWORD: ${{ secrets.DEEPEN_KEY_PASSWORD }}
        run: |
          test -n "$DEEPEN_KEYSTORE_B64"
          test -n "$DEEPEN_KEYSTORE_PASSWORD"
          test -n "$DEEPEN_KEY_ALIAS"
          test -n "$DEEPEN_KEY_PASSWORD"

      - name: Restore release keystore
        if: github.event_name != 'pull_request'
        env:
          DEEPEN_KEYSTORE_B64: ${{ secrets.DEEPEN_KEYSTORE_B64 }}
        run: |
          printf '%s' "$DEEPEN_KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/deepen-release.jks"

      - name: Build signed release APK
        if: github.event_name != 'pull_request'
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          DEEPEN_KEYSTORE_PASSWORD: ${{ secrets.DEEPEN_KEYSTORE_PASSWORD }}
          DEEPEN_KEY_ALIAS: ${{ secrets.DEEPEN_KEY_ALIAS }}
          DEEPEN_KEY_PASSWORD: ${{ secrets.DEEPEN_KEY_PASSWORD }}
        run: |
          gradle :app:assembleRelease \
            -PYOUTUBE_API_KEY="$YOUTUBE_API_KEY" \
            -PDEEPEN_KEYSTORE_PATH="$RUNNER_TEMP/deepen-release.jks" \
            -PDEEPEN_KEYSTORE_PASSWORD="$DEEPEN_KEYSTORE_PASSWORD" \
            -PDEEPEN_KEY_ALIAS="$DEEPEN_KEY_ALIAS" \
            -PDEEPEN_KEY_PASSWORD="$DEEPEN_KEY_PASSWORD" \
            -PVERSION_CODE="$VERSION_CODE" \
            -PVERSION_NAME="$VERSION_NAME"

      - name: Prepare signed release
        if: github.event_name != 'pull_request'
        id: release
        run: |
          mkdir -p artifacts
          APK_NAME="Deepen-${VERSION_NAME}.apk"
          APK_PATH="artifacts/${APK_NAME}"
          CHECKSUM_NAME="Deepen-${VERSION_NAME}-SHA256SUMS.txt"
          CHECKSUM_PATH="artifacts/${CHECKSUM_NAME}"

          cp app/build/outputs/apk/release/app-release.apk "$APK_PATH"

          "$ANDROID_HOME/build-tools/35.0.0/apksigner" \
            verify --verbose --print-certs "$APK_PATH"

          sha256sum "$APK_PATH" > "$CHECKSUM_PATH"

          echo "version=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "apk_name=$APK_NAME" >> "$GITHUB_OUTPUT"
          echo "apk_path=$APK_PATH" >> "$GITHUB_OUTPUT"
          echo "checksum_name=$CHECKSUM_NAME" >> "$GITHUB_OUTPUT"
          echo "checksum_path=$CHECKSUM_PATH" >> "$GITHUB_OUTPUT"

      - name: Upload debug APK
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: deepen-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Install rclone
        if: github.event_name != 'pull_request'
        run: |
          sudo apt-get update
          sudo apt-get install -y rclone

      - name: Upload release to Google Drive
        if: github.event_name != 'pull_request'
        env:
          RCLONE_CONFIG_CONTENT: ${{ secrets.GDRIVE_RCLONE_CONFIG || secrets.KITECHTV_RCLONE_CONFIG }}
          GDRIVE_APKS_FOLDER_ID: 1--t1tlg5ZYpFEgM7ayPLdAT-CAjs-G74
          APK_NAME: ${{ steps.release.outputs.apk_name }}
          APK_PATH: ${{ steps.release.outputs.apk_path }}
          CHECKSUM_NAME: ${{ steps.release.outputs.checksum_name }}
          CHECKSUM_PATH: ${{ steps.release.outputs.checksum_path }}
        run: |
          if [ -z "$RCLONE_CONFIG_CONTENT" ]; then
            echo "::error::Configure GDRIVE_RCLONE_CONFIG (preferred) or KITECHTV_RCLONE_CONFIG with the same rclone Google Drive config used by KitechTV."
            exit 1
          fi

          RCLONE_CONFIG="$RUNNER_TEMP/deepen-rclone.conf"
          printf '%s\n' "$RCLONE_CONFIG_CONTENT" > "$RCLONE_CONFIG"
          chmod 600 "$RCLONE_CONFIG"

          if ! grep -qE '^\[[^]]+\][[:space:]]*$' "$RCLONE_CONFIG"; then
            echo "::error::The configured rclone secret does not look like a valid rclone config."
            exit 1
          fi

          REMOTE_NAME="$(awk -F'[][]' '/^\[[^]]+\]/{print $2; exit}' "$RCLONE_CONFIG")"
          test -n "$REMOTE_NAME"

          rclone --config "$RCLONE_CONFIG" copyto \
            "$APK_PATH" \
            "${REMOTE_NAME}:${APK_NAME}" \
            --drive-root-folder-id "$GDRIVE_APKS_FOLDER_ID"

          rclone --config "$RCLONE_CONFIG" copyto \
            "$CHECKSUM_PATH" \
            "${REMOTE_NAME}:${CHECKSUM_NAME}" \
            --drive-root-folder-id "$GDRIVE_APKS_FOLDER_ID"

          rclone --config "$RCLONE_CONFIG" copyto \
            "$APK_PATH" \
            "${REMOTE_NAME}:Deepen-latest.apk" \
            --drive-root-folder-id "$GDRIVE_APKS_FOLDER_ID"

          rclone --config "$RCLONE_CONFIG" copyto \
            "$CHECKSUM_PATH" \
            "${REMOTE_NAME}:Deepen-latest-SHA256SUMS.txt" \
            --drive-root-folder-id "$GDRIVE_APKS_FOLDER_ID"

          rclone --config "$RCLONE_CONFIG" lsf \
            "${REMOTE_NAME}:" \
            --drive-root-folder-id "$GDRIVE_APKS_FOLDER_ID" \
            --include "Deepen-*"

      - name: Persist release version
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: |
          printf 'VERSION_CODE=%s\nVERSION_NAME=%s\n' "$VERSION_CODE" "$VERSION_NAME" > version.properties

          if git diff --quiet -- version.properties; then
            echo "version.properties already records $VERSION_NAME"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add version.properties
          git commit -m "Bump Android version to $VERSION_NAME [skip ci]"
          git push origin HEAD:main
